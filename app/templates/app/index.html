<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Student-DBMS Application </title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">CRUD PROJECT</a>
  </nav>
  <div class="container mt-2">
    <div class="row">
       <div class="col-md-4">
          <h2 class="bg-dark text-white text-center p-3">Insert Student details</h2>
          <form action="/insert" method="POST"> {%csrf_token%}
            <div>
                <input type="text" class="form-control" placeholder="Enter the student Name" name="name">
            </div>
             <div>
                <input type="email" class="form-control" placeholder="Enter the student Email" name="email">
            </div>
             <div>
                <input type="number" class="form-control" placeholder="Enter the student Age" name="age">
            </div>
             <div>
                <select name="gender" class="form-control"  id="gender">
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select>
            </div>
            <div>
                <button class="btn btn-success w-100">Submit</button>
            </div>
       </div> 
       <div class="col-md-8">
        <h2 class="text-center bg-dark text-white p-3">Student details</h2>
        <table class="table border">
            <thead>
                <tr style="text-align: center;">
                    <th>Id</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Edit</th>
                    <th>Delete</th>
                </tr>
            </thead>
            <tbody>
                {% for d in data %}
                <tr style="text-align: center;">
                    <td>{{d.id}}</td>
                    <td>{{d.name}}</td>
                    <td>{{d.email}}</td>
                    <td>{{d.age}}</td>
                    <td>{{d.gender}}</td>
                    <td><a href="/update/{{d.id}}" class="btn btn-outline-primary">Edit</a></td>
                    <td><a href="/delete/{{d.id}}" class="btn btn-outline-danger">Delete</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
       </div>
    </div>
  </div>
 </body>
 </html>
